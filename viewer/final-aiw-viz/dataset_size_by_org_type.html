<!doctype html><html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How big are the datasets each kind of organisation publishes?</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root { --breakpoint-compact: 500px; }            /* MUST equal BREAKPOINT_COMPACT in JS */
  html,body { margin:0; height:100vh; width:100vw; overflow:hidden; color:#0f172a;
    font-family: system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Helvetica,Arial,sans-serif; }
  .viz-grid { display:grid; height:100vh; box-sizing:border-box; padding-bottom:clamp(8px,2vh,18px);
    grid-template-rows:16fr 1fr 1fr; grid-template-columns:1fr 1fr; }
  #container1 { grid-column:1 / -1; } #viz { width:100%; height:100%; }
  #container5 { grid-column:1 / -1; display:flex; align-items:center; justify-content:center; padding:0 20px; }
  #container2 { grid-column:1 / -1; display:flex; align-items:center; justify-content:center; padding:0 20px; }
  #legend { display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:clamp(6px,1.4vw,20px); font-size:clamp(8px,1.35vw,13px); color:#475569; }
  #legend .lg { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  #container3 { font-size:clamp(5px,1.6vw,16px); display:flex; align-items:center; justify-content:flex-start;
    padding:0 20px; overflow:hidden; min-width:0; }
  #container3 #source-text { font-weight:600; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  #container3 #source-text a { color:#2756d3; text-decoration:underline; }
  #container4 { display:flex; justify-content:flex-end; align-items:center; padding:0 20px; overflow:hidden; min-width:0; }
  #container4 a { height:100%; display:flex; align-items:center; }
  #container4 img { height:100%; width:auto; max-height:100%; max-width:100%; object-fit:contain; }
  #tooltip { position:fixed; pointer-events:none; display:none; background:#fff;
    border:1px solid #DBDBDB; padding:6px 8px; font-size:12px; border-radius:4px; }
  #tooltip .tt-title { display:block; font-weight:700; margin-bottom:3px; }
  #tooltip span { color:#475569; }
  /* segmented switch (house style) */
  .selector-group { display:flex; align-items:center; justify-content:center;
    gap:clamp(2px,0.5vw,6px); padding:clamp(2px,0.4vw,4px);
    border-radius:6px; border:1px solid rgba(17,24,39,0.15); background:#f8fafc;
    max-width:100%; flex-shrink:1; min-width:0; }
  .selector-button { border:none; background:transparent; border-radius:6px;
    padding:clamp(4px,0.8vh,8px) clamp(8px,1.5vw,14px);
    font-size:clamp(9px,1.4vw,13px); font-weight:600; color:#475569;
    cursor:pointer; white-space:nowrap; min-width:0;
    transition:background 0.2s ease, color 0.2s ease; }
  .selector-button.active { background:#2756d3; color:#fff; }
  /* Short iframe / "snapshot" embed: drop ALL chrome; chart alone fills the frame. */
  @media (max-height:500px){
    .viz-grid { grid-template-rows:1fr !important; grid-template-columns:1fr !important; padding-bottom:0; }
    #container1 { grid-row:1 !important; grid-column:1 / -1 !important; }
    #container2,#container3,#container4,#container5 { display:none !important; }
  }
</style></head><body>
<div class="viz-grid">
  <div id="container1"><div id="viz"></div></div>
  <div id="container5"><div class="selector-group" id="scopeFilter"></div></div>
  <div id="container2"><div id="legend"></div></div>
  <div id="container3"><span id="source-text"></span></div>
  <div id="container4"><a href="https://aiworld.eu/" target="_blank" rel="noopener"><img src="https://aiworld.eu/logo-transparent.svg" alt="AI World"></a></div>
</div>
<div id="tooltip"></div>
<script>
// ---- CONFIG: declare everything; nothing implicit ----
const SHOW_CONTAINER_2 = 1, SHOW_CONTAINER_3 = 1, SHOW_CONTAINER_4 = 1, SHOW_CONTAINER_5 = 1;
const SHOW_TOOLTIP = 1;
const BREAKPOINT_COMPACT = 500;                       // px; MUST equal --breakpoint-compact

// One colour per organisation type (colour-blind-safe set reused across the HF project).
const COLORS = { company:"#DE8F05", university:"#CC78BC", "non-profit":"#D55E00",
                 community:"#029E73", classroom:"#CA9161", government:"#0173B2" };
const TYPE_LABEL = { company:"Company", university:"University", "non-profit":"Non-profit",
                     community:"Community", classroom:"Classroom", government:"Government" };

const SCOPES = [                                      // segmented switch, in display order
  { key:"all", btn:"All datasets", label:"all datasets" },
  { key:"top", btn:"Top 1,000 by downloads", label:"the 1,000 most-downloaded datasets" },
];
let currentScope = "all";

const X_DOMAIN = [0, 13];                             // log10 bytes, fixed so the two scopes stay comparable
const X_TICKS = [0, 3, 6, 9, 12];                     // 1 B / 1 KB / 1 MB / 1 GB / 1 TB
const THIN_N = 10;                                    // below this the bar is drawn dashed + flagged
const SNAPSHOT = "22 July 2026";
const SOURCE_NAME = "Hugging Face Hub snapshot, " + SNAPSHOT + " — CEPS analysis";
const SOURCE_HREF = "https://huggingface.co/datasets";

// Two bars per organisation type, as in the trends viewer: unweighted (one vote per
// dataset) and weighted by total downloads (one vote per download).
const SERIES_ORDER = [
  { key:"u", mean:"mean",  sd:"sd",  shade:1,   label:"per dataset (unweighted)" },
  { key:"w", mean:"wmean", sd:"wsd", shade:0.7, label:"weighted by total downloads" },
];

// One object per (organisation type x scope). mean/sd are of log10(repo bytes, mainSize),
// wmean/wsd the same weighted by downloadsAllTime; n = datasets with a size in that scope,
// pop = all datasets of that type in the snapshot, dl = their total downloads.
const DATA = [
  { type:"government", scope:"all", n:724,   pop:725,   mean:6.5624,  sd:1.9278, wmean:9.8227,  wsd:2.2495, dl:736490 },
  { type:"community",  scope:"all", n:61805, pop:61887, mean:7.3201,  sd:1.8730, wmean:9.7741,  wsd:2.5145, dl:494298954 },
  { type:"non-profit", scope:"all", n:65570, pop:65622, mean:6.4690,  sd:2.0295, wmean:9.2164,  wsd:2.6257, dl:392183112 },
  { type:"classroom",  scope:"all", n:4549,  pop:4550,  mean:7.6036,  sd:1.8552, wmean:9.0065,  wsd:1.6998, dl:4877857 },
  { type:"company",    scope:"all", n:30564, pop:30809, mean:6.9510,  sd:2.3637, wmean:8.7181,  wsd:2.2215, dl:505886190 },
  { type:"university", scope:"all", n:24014, pop:24041, mean:7.5459,  sd:2.0112, wmean:8.6384,  wsd:2.1198, dl:254001027 },
  { type:"government", scope:"top", n:1,     pop:725,   mean:12.0184, sd:0.0000, wmean:12.0184, wsd:0.0000, dl:203526 },
  { type:"community",  scope:"top", n:267,   pop:61887, mean:9.9915,  sd:2.5094, wmean:9.9255,  wsd:2.5918, dl:393362960 },
  { type:"classroom",  scope:"top", n:4,     pop:4550,  mean:9.4499,  sd:0.9692, wmean:9.5323,  wsd:0.9247, dl:713402 },
  { type:"non-profit", scope:"top", n:264,   pop:65622, mean:9.3898,  sd:2.7388, wmean:9.4275,  wsd:2.7332, dl:299831522 },
  { type:"company",    scope:"top", n:278,   pop:30809, mean:9.0532,  sd:2.8369, wmean:8.7357,  wsd:2.1922, dl:432237863 },
  { type:"university", scope:"top", n:186,   pop:24041, mean:9.3470,  sd:2.5171, wmean:8.5331,  wsd:2.0449, dl:195454168 },
];

document.getElementById("source-text").innerHTML =
  'Source: <a href="'+SOURCE_HREF+'" target="_blank" rel="noopener">'+SOURCE_NAME+'</a>';

// Show only the footer rows whose flag is on, then recompute grid rows.
(function applyContainerVisibility(){
  const grid = document.querySelector(".viz-grid"), c = n => document.getElementById("container"+n);
  const c2=c(2), c3=c(3), c4=c(4), c5=c(5);
  if (c2 && !SHOW_CONTAINER_2) c2.style.display="none";
  if (c3 && !SHOW_CONTAINER_3) c3.style.display="none";
  if (c4 && !SHOW_CONTAINER_4) c4.style.display="none";
  if (c5 && !SHOW_CONTAINER_5) c5.style.display="none";
  const rowCtrl=SHOW_CONTAINER_5, rowLegend=SHOW_CONTAINER_2, rowFooter=SHOW_CONTAINER_3||SHOW_CONTAINER_4;
  const rows=[]; let r=1;
  rows.push((20-(rowCtrl?1:0)-(rowLegend?1:0)-(rowFooter?1:0))+"fr");
  if (rowCtrl)   { rows.push("1fr"); r++; if (c5) c5.style.gridRow=r; }
  if (rowLegend) { rows.push("1fr"); r++; if (c2) c2.style.gridRow=r; }
  if (rowFooter) { rows.push("1fr"); r++;
    if (SHOW_CONTAINER_3 && c3) c3.style.gridRow=r;
    if (SHOW_CONTAINER_4 && c4) c4.style.gridRow=r;
    if (SHOW_CONTAINER_3 && !SHOW_CONTAINER_4 && c3) c3.style.gridColumn="1 / span 2";
    if (!SHOW_CONTAINER_3 && SHOW_CONTAINER_4 && c4) c4.style.gridColumn="1 / span 2";
  }
  grid.style.gridTemplateRows = rows.join(" ");
  c(1).style.gridRow = "1";
})();

// ---- helpers ----
const UNITS = ["B","KB","MB","GB","TB","PB"];
function fmtBytes(v){                                  // 8.9 MB, 1 TB, 940 KB
  if (!isFinite(v) || v <= 0) return "–";
  const k = Math.min(UNITS.length-1, Math.floor(Math.log10(v)/3));
  const x = v / Math.pow(1000, k);
  const near = Math.abs(x - Math.round(x)) < 0.05;     // exact decades read "1 MB", not "1.0 MB"
  return (x >= 100 || near ? Math.round(x) : x.toFixed(1)) + " " + UNITS[k];
}
const fmtInt = d3.format(",");
const fmtBig = d3.format(".3~s");                      // 494M downloads
function tickLabel(t){ return fmtBytes(Math.pow(10, t)); }

function darker(hex, f){                               // multiply RGB — the weighted bar's shade
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
  return "#" + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, "0")).join("");
}

// One drawable bar per (type x series), sorted so the download-weighted bar drives the order.
function barsFor(scope){
  const rows = DATA.filter(d => d.scope === scope).slice().sort((a,b) => b.wmean - a.wmean);
  const bars = [];
  for (const d of rows)
    for (const s of SERIES_ORDER)
      bars.push({ row:d, series:s, type:d.type, mean:d[s.mean], sd:d[s.sd],
                  fill:s.shade === 1 ? COLORS[d.type] : darker(COLORS[d.type], s.shade) });
  return { rows, bars };
}

const measure = (() => {                               // text width, for dynamic margins
  const ctx = document.createElement("canvas").getContext("2d");
  return (txt, px, weight) => { ctx.font = (weight||400)+" "+px+"px system-ui, sans-serif"; return ctx.measureText(txt).width; };
})();

const tooltip = d3.select("#tooltip");
const vizContainer = document.getElementById("viz");
let shouldAnimate = true;   // true on first render and on a scope switch, false on resize redraws

function buildScopeFilter(){
  const box = document.getElementById("scopeFilter");
  box.innerHTML = "";
  for (const s of SCOPES){
    const b = document.createElement("button");
    b.type = "button"; b.className = "selector-button"; b.textContent = s.btn;
    b.dataset.scope = s.key;
    b.title = "Show " + s.label;
    b.setAttribute("aria-label", "Show " + s.label);
    b.addEventListener("click", () => {
      if (currentScope === s.key) return;              // no redundant redraw
      currentScope = s.key; updateScopeState(); shouldAnimate = true; render();
    });
    box.appendChild(b);
  }
  updateScopeState();
}
function updateScopeState(){
  document.querySelectorAll("#scopeFilter .selector-button").forEach(b =>
    b.classList.toggle("active", b.dataset.scope === currentScope));
}

function buildLegend(){
  const scope = SCOPES.find(s => s.key === currentScope);
  const swatch = shade =>
    '<svg width="26" height="10"><rect width="26" height="10" rx="1" fill="'
    + (shade === 1 ? "#94a3b8" : darker("#94a3b8", shade)) + '"></rect></svg>';
  document.getElementById("legend").innerHTML =
    SERIES_ORDER.map(s => '<span class="lg">' + swatch(s.shade) + s.label + '</span>').join("")
    + '<span class="lg"><svg width="30" height="10"><line x1="2" x2="28" y1="5" y2="5" stroke="#0f172a" stroke-width="1.4"></line>'
    + '<line x1="2" x2="2" y1="1" y2="9" stroke="#0f172a" stroke-width="1.4"></line>'
    + '<line x1="28" x2="28" y1="1" y2="9" stroke="#0f172a" stroke-width="1.4"></line></svg>'
    + '±1 SD of log₁₀(size)</span>'
    + '<span class="lg">Bars = geometric mean · individual accounts excluded · ' + scope.label + '</span>'
    + (currentScope === "top"
        ? '<span class="lg">Dashed = fewer than ' + THIN_N + ' datasets, not robust</span>' : '');
}

function render(){
  d3.select("#viz").selectAll("*").remove();
  const rect = vizContainer.getBoundingClientRect();
  const W = Math.max(240, rect.width), H = Math.max(160, rect.height);
  const compact = window.matchMedia(`(max-height:${BREAKPOINT_COMPACT}px)`).matches;
  const animate = shouldAnimate && !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  shouldAnimate = false;

  const { rows, bars } = barsFor(currentScope);
  const fs = Math.max(9, Math.min(14, W/62));                  // tick / label size
  const fsName = Math.max(10, Math.min(16, W/48));             // y-axis type names
  const nameW = Math.max(...rows.map(d => measure(TYPE_LABEL[d.type], fsName, 700)));
  const valW  = Math.max(...bars.map(b => measure(fmtBytes(Math.pow(10, b.mean)), fs, 700)));
  const labelH = fs*1.15;                                      // row above/below each bar for its value
  const M = { top: Math.round(labelH), right: Math.round(fs*2.2), bottom: Math.round(fs*3.4),
              left: Math.round(nameW + fs*1.2) };
  const iw = Math.max(60, W - M.left - M.right), ih = Math.max(60, H - M.top - M.bottom);

  const svg = d3.select("#viz").append("svg").attr("width", W).attr("height", H);
  const g = svg.append("g").attr("transform", `translate(${M.left},${M.top})`);

  const x = d3.scaleLinear().domain(X_DOMAIN).range([0, iw]);
  // Band layout, top to bottom: value / unweighted bar / gap / weighted bar / value.
  // Padding is small because the two value rows already separate neighbouring types.
  const y = d3.scaleBand().domain(rows.map(d => d.type)).range([0, ih]).padding(0.16);
  const yc = d => y(d.type) + y.bandwidth()/2;                 // band centre, for the type name
  const gap = Math.max(2, y.bandwidth()*0.05);                 // between the paired bars
  const bh = Math.max(8, Math.min((y.bandwidth() - 2*labelH - gap)/2, 20));   // one bar
  const barY = b => yc(b.row) + (b.series.key === "u" ? -gap/2 - bh : gap/2);
  const barC = b => barY(b) + bh/2;

  // gridlines: one per decade, labelled every third (1 B / 1 KB / 1 MB / 1 GB / 1 TB)
  g.append("g").selectAll("line").data(d3.range(X_DOMAIN[0], X_DOMAIN[1]+1)).join("line")
    .attr("x1", d => x(d)).attr("x2", d => x(d)).attr("y1", 0).attr("y2", ih)
    .attr("stroke", "#DBDBDB").attr("stroke-dasharray", "2,3")
    .attr("stroke-width", d => X_TICKS.includes(d) ? 1 : 0.5)
    .attr("opacity", d => X_TICKS.includes(d) ? 1 : 0.55);
  g.append("g").selectAll("text").data(X_TICKS).join("text")
    .attr("x", d => x(d)).attr("y", ih + fs*1.5).attr("text-anchor", "middle")
    .attr("font-size", fs).attr("font-weight", 600).attr("fill", "#475569")
    .text(tickLabel);
  if (!compact)
    g.append("text").attr("x", iw/2).attr("y", ih + fs*3.1).attr("text-anchor", "middle")
      .attr("font-size", fs).attr("font-weight", 700).attr("fill", "#0f172a")
      .text("Repository size on disk (log scale)");

  // type names on the left; count underneath
  const names = g.append("g").selectAll("g").data(rows).join("g");
  names.append("text")
    .attr("x", -fs*0.9).attr("y", d => yc(d) + (compact ? fsName*0.35 : -fsName*0.05))
    .attr("text-anchor", "end").attr("font-size", fsName).attr("font-weight", 700).attr("fill", "#0f172a")
    .text(d => TYPE_LABEL[d.type]);
  if (!compact)
    names.append("text")
      .attr("x", -fs*0.9).attr("y", d => yc(d) + fs*1.15)
      .attr("text-anchor", "end").attr("font-size", fs*0.92).attr("fill", "#475569")
      .text(d => "n = " + fmtInt(d.n));

  g.append("line").attr("x1", 0).attr("x2", 0).attr("y1", 0).attr("y2", ih)
    .attr("stroke", "#111111").attr("stroke-width", 1);

  const thin = b => b.row.n < THIN_N;
  const barSel = g.append("g").selectAll("rect").data(bars).join("rect")
    .attr("x", 0).attr("y", barY).attr("height", bh)
    .attr("fill", b => b.fill)
    .attr("opacity", b => thin(b) ? 0.5 : 1)
    .attr("stroke", b => thin(b) ? b.fill : "none")
    .attr("stroke-width", b => thin(b) ? 1.2 : 0)
    .attr("stroke-dasharray", b => thin(b) ? "4,3" : null)
    .attr("width", animate ? 0 : b => Math.max(1, x(b.mean)));

  if (SHOW_TOOLTIP){
    barSel.on("mousemove", (evt, b) => {
        const d = b.row;
        tooltip.style("display", "block")
          .style("left", Math.min(evt.clientX + 12, window.innerWidth - 230) + "px")
          .style("top", (evt.clientY + 14) + "px")
          .html('<span class="tt-title">' + TYPE_LABEL[d.type] + ' — ' + b.series.label + '</span>'
            + 'Geometric mean: <b>' + fmtBytes(Math.pow(10, b.mean)) + '</b><br>'
            + '<span>' + (b.sd > 0
                ? '±1 SD: ' + fmtBytes(Math.pow(10, b.mean - b.sd)) + ' – ' + fmtBytes(Math.pow(10, b.mean + b.sd))
                : 'single dataset — no spread') + '</span><br>'
            + '<span>' + fmtInt(d.n) + ' of ' + fmtInt(d.pop) + ' datasets'
            + (currentScope === "top" ? ' — ' + (d.n/10).toFixed(1) + '% of the top 1,000' : '')
            + '</span><br>'
            + '<span>' + fmtBig(d.dl) + ' total downloads</span>');
      })
      .on("mouseleave", () => tooltip.style("display", "none"));
  }

  // +-1 SD whisker with end caps, one per bar
  const wh = g.append("g").attr("stroke", "#0f172a").attr("stroke-width", 1.4)
    .attr("opacity", animate ? 0 : 1);
  for (const b of bars){
    if (!(b.sd > 0)) continue;
    const y0 = barC(b), x0 = x(b.mean - b.sd), x1 = x(b.mean + b.sd);
    wh.append("line").attr("x1", x0).attr("x2", x1).attr("y1", y0).attr("y2", y0);
    const cap = Math.max(3, bh*0.34);
    for (const xc of [x0, x1])
      wh.append("line").attr("x1", xc).attr("x2", xc)
        .attr("y1", y0 - cap).attr("y2", y0 + cap);
  }

  // geometric mean, at each bar's tip: above the unweighted bar, below the weighted one
  const vals = g.append("g").selectAll("text").data(bars).join("text")
    .attr("x", b => Math.min(iw + M.right - valW - 2, x(b.mean) + fs*0.35))
    .attr("y", b => b.series.key === "u" ? barY(b) - fs*0.32 : barY(b) + bh + fs*0.92)
    .attr("font-size", fs*0.95).attr("font-weight", 700).attr("fill", "#0f172a")
    .attr("opacity", animate ? 0 : 1)
    .text(b => fmtBytes(Math.pow(10, b.mean)));

  if (animate){
    barSel.transition().duration(850).ease(d3.easeCubicOut)
      .attr("width", b => Math.max(1, x(b.mean)));
    wh.transition().delay(500).duration(350).attr("opacity", 1);
    vals.transition().delay(600).duration(300).attr("opacity", 1);
  }
  buildLegend();     // the legend names the active scope, so it follows every render
}

try {
  buildScopeFilter();
  render();
} catch (err){
  d3.select("body").append("div")
    .attr("style", "position:fixed;bottom:8px;left:8px;background:#fee;border:1px solid #de2d26;color:#7f1d1d;padding:6px 8px;font-size:12px;border-radius:4px")
    .text("Chart failed to render: " + err.message);
}

let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 220); });
if (typeof ResizeObserver !== "undefined")
  new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 220); }).observe(vizContainer);
</script></body></html>
